# =============================================================================
# LiteLLM Proxy 模型映射（CLAUDE.md 5.1 / 5.2 / NO-02）
#
# 业务代码只认左侧的逻辑名（primary-chat / embedding / rerank / judge / vision-chat），
# 具体型号只在本文件出现。换型号或切私有化端点，改这里，不改任何业务代码。
#
# 密钥一律 os.environ/... 注入，本文件不得出现真实密钥（NO-03 / 10.1）。
#
# 每个映射的落地依据已在注释里写明"查证到什么、还差什么"——凡未经运行时验证的，
# 都必须显式标注，不得让读者以为已经跑通。
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # primary-chat：主对话模型
  #
  # deepseek 是 LiteLLM 的**原生 provider**（源码含 litellm/llms/deepseek/ 模块，
  # 且 "deepseek" 在 LlmProviders 枚举内），无需 api_base，只需 DEEPSEEK_API_KEY。
  # ---------------------------------------------------------------------------
  - model_name: primary-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      # 生成答案要可复现（CLAUDE.md 5.3：评测用固定温度）
      temperature: 0.2
      max_tokens: 2048

  # ---------------------------------------------------------------------------
  # embedding：向量化（Qwen3-Embedding，SiliconFlow 云端）
  #
  # 【为什么用 openai/ 前缀】LiteLLM 没有任何原生 SiliconFlow provider（已核对
  # 源码树与文档树，无 siliconflow 条目）。SiliconFlow 的 /v1/embeddings 是标准
  # OpenAI 形状，故走 LiteLLM 的 OpenAI 兼容通道 + 自定义 api_base。
  #
  # 【模型 ID 与维度已运行时核实（2026-10-16）】Qwen/Qwen3-Embedding-8B 出现在
  # SiliconFlow `GET /v1/models` 返回的 99 个模型清单里；实测输出 **4096** 维，
  # 与 .env.example 的 MILVUS_DIM=4096 一致。若改用 4B(2560)/0.6B(1024)，必须
  # 同步改 MILVUS_DIM，否则入库 upsert 会 fail-fast 报维度不符（这是有意的：
  # 宁可启动即失败，也不要写入错的向量）。
  #
  # 【encoding_format 必须显式指定 —— 踩过的坑，别删】不指定时 LiteLLM 1.82.3
  # 会把该参数以**空值**转发给上游，而 SiliconFlow 对空值直接回
  # `400 {"code":20015,"message":"The parameter is invalid. Please check again."}`。
  # 实测对照（同一 key、同一文本）：
  #   直连上游 {model,input}                         → 200
  #   经网关    {model,input}                        → 400（20015）
  #   经网关    {model,input,encoding_format:"float"} → 200，dims=4096
  #   直连上游 encoding_format:null 或 ""             → 400（20015）
  #   直连上游 dimensions:null / user:null            → 200（这两个不受影响）
  # 修在网关侧而非业务代码：这是 **provider 的怪癖**，按 NO-02 / 第 5 章，业务
  # 代码只认逻辑名，型号差异与上游怪癖一律收敛在本文件。
  # ---------------------------------------------------------------------------
  - model_name: embedding
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-8B
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
      encoding_format: "float"   # 见上：不是可选优化，缺了就直接 400
    model_info:
      # 文档 model_list 结构的规范取值（docs/proxy/config_settings.md 即以
      # mode: embedding 为例）。声明后网关按 embedding 语义处理该部署。
      mode: embedding

  # ---------------------------------------------------------------------------
  # rerank：重排（Qwen3-Reranker，SiliconFlow 云端）
  #
  # 【为什么是 hosted_vllm 而不是某个原生 provider】这是一个查证后得出的非显然
  # 结论，值得写清楚：
  #   - LiteLLM 官方 /rerank 支持的 provider 列表里**没有** SiliconFlow；但有
  #     litellm/llms/hosted_vllm/rerank/transformation.py，且 "hosted_vllm" 确实
  #     在 litellm.rerank() 的 custom_llm_provider 字面量内（已核源码）。
  #   - HostedVLLMRerankConfig.get_complete_url() 对 api_base 的处理是：
  #     结尾为 /v1/rerank 则改写为 /rerank，否则追加 /rerank。
  #     因此 api_base=https://api.siliconflow.cn/v1 → 实际请求
  #     https://api.siliconflow.cn/v1/rerank，与 SiliconFlow 文档的 rerank 端点一致。
  #   - 其请求体为 {model, query, documents, top_n, return_documents,...}，
  #     响应按 results[].{index, relevance_score} 解析——与 SiliconFlow 的
  #     Jina 兼容形状一致，也与本仓 GatewayHttpClient.RerankResponse 的契约一致。
  #
  # 【未设 model_info.mode】官方 rerank 示例（docs/rerank.md）的 model_list 里
  # 没有 mode 字段，故遵循官方示例不设；加一个没有依据的字段比不加更危险。
  #
  # 【已运行时验证（2026-10-16）】上述路由推断经 test_litellm_proxy.py 的
  # test_rerank_returns_relevance_ordered 在真实网关 + 真实 SiliconFlow 上跑通：
  # 返回 results[].{index, relevance_score}，且与问题相关的那条排第一——断言的是
  # "排第一"而不只是"有返回"，因为路由接错时往往返回一堆等分或乱序结果，只查结构
  # 会漏掉。因此**不需要**启用计划中风险 #5 的兜底（Reranker 直连上游）。
  # ---------------------------------------------------------------------------
  - model_name: rerank
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3-Reranker-8B
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY

  # ---------------------------------------------------------------------------
  # judge：评估裁判模型（CLAUDE.md 5.2 列的应当存在的逻辑名 / 9.2 裁判模型固定并记录版本）
  #
  # 【为什么单列一条而不复用 primary-chat】裁判与生成必须能**各自换型**：评测集评分
  # 要固定版本以便跨版本比较，而生成侧要随产品迭代调型。共用一个逻辑名会让
  # "只换生成模型、不动裁判"这件事做不到，分数因此失去可比性。
  #
  # 【temperature=0 是硬要求】CLAUDE.md 5.3：评测用固定随机种子或 temperature=0。
  # 裁判分数若带随机性，"这次比基线低 2 分"就分不清是模型退化还是采样抖动。
  #
  # 【2026-10-21 换型：DeepSeek → 硅基流动 Qwen】上游改为
  # `openai/Qwen/Qwen3.5-122B-A10B`（OpenAI 兼容通道 + api_base，理由同 embedding），
  # 与生成模型 primary-chat（DeepSeek）**不同家族**，原先"裁判与被评者同源"的
  # 自偏好偏置不再成立。型号先在网关容器内用 /v1/models 与一次 50 token 的 JSON
  # 探测验证过（纯 JSON 返回，约 3.7 秒）。
  #
  # 【边界——必须原样保留这段注释】裁判在云端，**问题、检索证据与答案会出域到
  # SiliconFlow**。仅限公开演示语料，客户数据与生产环境不得使用；生产须换
  # 私有化裁判（CLAUDE.md 5.8 / 10.1）。该偏离登记于 docs/adr/0005，产物里
  # 逐条写入 run.judge.caveat。
  #
  # 【max_tokens=8192】与 evaluation/judge.py、ragas_backend.py 的显式取值一致：
  # faithfulness 要为答案里的每条断言输出一条判定；Qwen3.5 常把推演写进
  # reason 字段，输出长度是重尾的。改这里要同步改应用侧。
  # 注意这只是**路由默认**：调用方自带 max_tokens 时会被覆盖。RAGAS 的
  # llm_factory 默认 1024，故 evaluation/ragas_backend.py 显式传 8192——
  # 只改本文件抬不高它的上限（实测：1024 截断导致 IncompleteOutputException；
  # 4096 时仍能写满）。
  #
  # 【必须关闭思考模式（2026-10-21 实测）】Qwen3.5 默认开思考：一句
  # `{"ok": true}` 也要 204 个输出 token（其中 198 个是思考 token）。RAGAS 的
  # 长提示会在 4096 上限内被截断，判分落成 IncompleteOutputException（测量失败、
  # 不带分数）。经网关透传 `enable_thinking: false` 后同一请求降到 5 token 且
  # 返回纯 JSON。故在路由上固定关闭，不依赖每个调用方自己记得传。
  # ---------------------------------------------------------------------------
  - model_name: judge
    litellm_params:
      model: openai/Qwen/Qwen3.5-122B-A10B
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
      temperature: 0.0
      max_tokens: 8192
      extra_body:
        enable_thinking: false

  # ---------------------------------------------------------------------------
  # vision-chat：多模态解析期的图片理解（ADR-0004）
  #
  # 【调用方是 RAGFlow，不是本仓业务代码】RAGFlow 的 `layout_recognize` 在解析
  # 扫描件/内嵌图/表格时，把整页或图片交给视觉模型生成描述，描述进入 chunk 的
  # `content`，后续检索与答案生成仍是纯文本链路。RAGFlow 侧以 OpenAI-API-
  # Compatible 模型接入本网关（见 docs/runbooks/ragflow_setup.md），模型名填
  # `vision-chat`，因此换型同样只改本文件。
  #
  # 【provider 选择理由同 embedding】LiteLLM 没有 SiliconFlow 原生 provider，
  # 其 /v1/chat/completions 是标准 OpenAI 形状，故走 openai/ 前缀 + 自定义
  # api_base；图片以 OpenAI 的 image_url + base64 data URL 传递。
  #
  # 【已运行时验证（2026-10-20）】在网关容器内向 localhost:4000 发一张 160×80 的
  # 测试 PNG（白底黑色矩形），`model=vision-chat`，上游返回
  # `一个黑色的长方形。`，HTTP 200，响应 model 字段为 vision-chat。这一条同时
  # 证明了：模型 ID 在售、网关透传 data URL、上游按 OpenAI 形状解析图片。
  #
  # 【温度 0 的理由】图片描述是检索证据的一部分，同一张图两次解析得到不同描述
  # 会让证据不可复现；且评估基线按解析产物冻结。
  #
  # 【演示期边界】该路由指向云端 API，图片内容因此出域。仅限公开演示语料
  # （与 embedding/rerank 同一约束），不得用于客户数据；生产切私有化 VLM 时
  # 只改本文件（CLAUDE.md 10.1，ADR-0004）。
  # ---------------------------------------------------------------------------
  - model_name: vision-chat
    litellm_params:
      model: openai/Qwen/Qwen3-VL-30B-A3B-Instruct
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
      temperature: 0.0
      max_tokens: 1024
    model_info:
      # 供网关的模型能力查询与路由使用；LiteLLM 对 openai/ 自定义端点不会自动
      # 推断图像能力，显式声明避免调用方据此过滤掉该模型。
      supports_vision: true

# -----------------------------------------------------------------------------
# 刻意不配置的项，以及原因（留白比配错更需要说明）：
#
# - router_settings.fallbacks（CLAUDE.md 5.4 要求的模型 fallback 链）：
#   当前 .env 只有 DeepSeek 与 SiliconFlow 两家密钥，未配置第二家对话模型，
#   无 key 的 fallback 写了也是死配。此项作为**已知缺口**记入 CHANGELOG，
#   待补第二家 provider 密钥后再加 fallback-chat 条目与本段配置。
#
# - litellm_settings（如 num_retries / drop_params）：
#   重试策略统一由应用侧 core/retry.py 的 tenacity 负责（CLAUDE.md 3.6）。
#   此处再配一层重试会变成两层叠加，重试次数相乘，且掩盖真实错误。
#
# - general_settings.master_key / database_url：
#   主密钥由 compose 注入的 LITELLM_MASTER_KEY 环境变量提供，LiteLLM 自动读取；
#   演示期用静态主密钥，不需要 LiteLLM 自身的 Postgres（密钥管理 UI / 虚拟密钥），
#   不接库可少一处启动依赖。
# -----------------------------------------------------------------------------
