# pre-commit 门禁（CLAUDE.md 12.3）：ruff(format+lint) → mypy → 文件检查 → 密钥扫描
# 本地 hook 统一经 `uv run`，锁定版本来自 pyproject.toml + uv.lock，避免版本漂移。
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: mypy
        name: mypy (incremental)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # 大文件拦截（NO-17：语料/权重/二进制不入库）
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
