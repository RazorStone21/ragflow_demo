# pre-commit 门禁（CLAUDE.md 12.3）：ruff(format+lint) → mypy → 密钥扫描 → 文件检查
# 本地 hook 统一经 `uv run`，锁定版本来自 pyproject.toml + uv.lock，避免版本漂移。
repos:
  - repo: local
    hooks:
      # 密钥扫描（CLAUDE.md 12.3 / NO-17）：扫描**已暂存**内容，命中即阻断提交。
      # 取 `language: system` 而非上游的 `language: golang`：上游 hook 会在首次运行时
      # 现场编译 gitleaks，需要 Go 工具链与公网拉取；本仓库其余 hook 同样采用
      # "工具预置 + 声明式调用"的形态，保持一致。
      # 前置条件：PATH 上存在 gitleaks **>= v8.19**（`git --pre-commit` 子命令的下限）。
      # 安装方式自行选择（winget / 官方 release 二进制 / CI 镜像内置），本仓库不代为下载。
      # 未安装时本 hook 会报 "command not found" —— 这是**有意的失败**：密钥防线不得静默失效。
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        pass_filenames: true

      - id: mypy
        name: mypy (incremental)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # CLAUDE.md 是**有意只读**的最高规范文件（全仓唯一 -r--r--r--）。
      # 下面三个是"就地改写"型钩子，对只读文件必然失败：end-of-file-fixer 会无条件以
      # rb+ 打开每个文件（即使无需修正），在只读文件上直接抛 PermissionError，导致
      # **每次提交都失败**——而长期红着的门禁会把人训练成加 --no-verify 绕过，
      # 恰是 CLAUDE.md 12.3 / NO-06 明令禁止的。故显式排除，保留只读保护。
      # 注意：排除的只是这三条文本规范化钩子；ruff/mypy/gitleaks 本就只作用于代码文件。
      # 将来按 NO-20 修订 CLAUDE.md 时，需先经人确认再临时 attrib -r，改完恢复。
      #
      # **提交本身会悄悄清掉只读位（2026-10-16 实测）**：pre-commit 为保护未暂存改动
      # 会 stash 再还原，还原时**重写**了 CLAUDE.md，`attrib` 从 `A R` 变回 `A`（文件
      # 内容与 `git status` 都不报警，只读保护就这样无声失效）。故**凡提交过
      # CLAUDE.md，事后必须 `attrib +R CLAUDE.md` 并核对 `ls -l` 显示 `-r--r--r--`**。
      # 另记：该文件历史行尾为 CRLF（上表 `* text=auto eol=lf` 它并未生效），这是一处
      # 既存的、经本条排除条款默认接受的偏离——本条**不改变**它，也不据此重新规范化。
      - id: trailing-whitespace
        exclude: ^CLAUDE\.md$
      - id: end-of-file-fixer
        exclude: ^CLAUDE\.md$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # 大文件拦截（NO-17：语料/权重/二进制不入库）
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^CLAUDE\.md$
