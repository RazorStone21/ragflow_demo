# 评估门禁阈值（CLAUDE.md 9.2 / NO-16）
#
# 为什么是文件而不是 settings.py 里的字段：这些值定义"什么算通过"。放在环境变量里
# 意味着可以有人用一行 export 把门禁调松，而产物里看不出区别。放文件里则改动必然
# 经过一次提交、一次评审、一条 CHANGELOG。
#
# 【观察期】本文件当前**不阻断**提交，只产出报告与判定。阈值取自首轮实测前的估计，
# 待一轮真实评估后按实测分布校准（见 tests/evals/README.md 的校准说明）。
#
# 键名必须与 evaluation/schemas.py 的 MetricName **逐字一致**（脚本会校验，
# 拼错即报错而不是被静默忽略——被忽略的阈值等于没有门禁）。
#
# 取值哲学：**凡是相关规范已经定死的，一律 1.00，不给"略低于满分"留余地**；
# 只有真正带统计性质的指标才用 < 1.00。

[thresholds]

# --- 规范红线的直接落地：不留余地 ---

citation_integrity = 1.00
# 引用完整性。NO-12："无证据不得给出事实性结论"、"引用编号必须与正文一致"。
# 这是红线，不是质量指标：0.99 意味着每 100 条答案就有 1 条编造或错引引用。

refusal_correctness = 1.00
# 拒答正确性。该拒没拒 = 幻觉风险，是 RAG 最贵的失败模式。
# 语料外问题答得越流畅越危险；这类错误没有"可接受的比率"。

tenant_isolation = 1.00
# 租户隔离（NO-19）。一次越权检索 = 一次数据泄露，不存在可接受的失败率。
# 注意：本指标只覆盖"检索层是否漏了别人的数据"这一层，
# **不能**替代集成测试对 RLS / thread_id 命名空间的验证。

prompt_hygiene = 1.00
# 提示词卫生：渲染后的证据块不得含未中和的栅栏标记（CLAUDE.md 10.3）。
# 它断言的是"生产渲染路径确实调用了 neutralize_untrusted"这一件事——
# 接线是否存在，非黑即白。

image_citation_integrity = 1.00
# 图片引用完整性（ADR-0004）：被引用证据若带图，引用条目必须原样带出同样的图。
# 缺图、多图、错图都算失败——与 citation_integrity 同属引用红线：
# 引用里少了图，前端就永远展示不出证据图，而这种失败在文本上看不出来。

# --- 具备统计性质：允许低于满分，但初值从严 ---

status_accuracy = 0.90
# 答案状态（answered / insufficient_evidence 等）与期望一致的比例。
# 允许小幅偏差，因为"勉强充足"的边界题上，判定翻转不必然是缺陷。
# 校准提示：若首轮实测 < 0.90，先查这些题的证据是否本就处于阈值边缘。

retrieval_hit = 0.90
# 期望文档（must_hit）被检出的比例。
# 允许 10% 失败：rerank 与阈值裁掉边缘证据是设计内行为，
# 而**逐题**的检索失败由 citation_integrity / faithfulness 兜底捕获。
# 校准提示：连续两轮低于 0.90 应视为检索策略退化，而非调低本值。

image_evidence_hit = 0.90
# 期望图片（must_hit，按文档名 + 页码）随证据被检索到的比例（ADR-0004）。
# 按文档名 + 页码匹配，**不要求** media_type=image：RAGFlow 常把 VLM 描述过的
# 图标成 table，按 media_type 过滤会把真实用例全判成未命中。
# 与 retrieval_hit 同值同理由；四个多模态样例实测 1.0000（2026-10-20）。

faithfulness = 0.80
# 答案事实性断言中"有证据支撑"的占比（裁判判定）。
# 不设 1.00：该指标由模型判定且有已知同源偏置（见下），
# 把它定成满分等于让裁判的随机性直接变成门禁失败。
# ⚠️ 同源偏置：当前裁判与生成共用同一上游模型，此分数**偏乐观**，
#    不得当中性分数使用（evaluation/judge.py 的 SAME_SOURCE_CAVEAT，ADR-0003）。

answer_relevancy = 0.80
# 答案是否正面回答了问题（裁判判定）。同样受同源偏置影响。
# 与 faithfulness 分开设阈的理由：二者失败模式不同——
# 前者是"编造"，后者是"答非所问"，混在一起会互相掩盖。

# --- 样本量下限 ---
#
# 某指标的实际采样数低于下限时，无论分数多高都**不计为达标**（报告标"样本不足"）。
# 理由：3 条样例算出 1.00 与 20 条算出 0.95，前者不构成证据。
# 缺此项的话，`--limit 3` 跑出来的产物会"全绿通过"，这是最容易骗过自己的假绿。
[min_samples]

citation_integrity = 5
refusal_correctness = 5
tenant_isolation = 5      # 仅 security 类样例会采集该指标（当前 6 条）
prompt_hygiene = 10       # 每条例题都采样，故下限设高
status_accuracy = 10
retrieval_hit = 10
faithfulness = 10         # 需裁判；--skip-judge 时为 0，必然"样本不足"而非"通过"
answer_relevancy = 10
image_evidence_hit = 3        # 仅带 must_hit 图片的多模态样例采样（当前 4 条）
image_citation_integrity = 3  # 同上；且只在非 retrieval 层采集，--layer retrieval 必"未采集"
