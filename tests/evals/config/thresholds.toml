# 评估门禁阈值（CLAUDE.md 9.2 / NO-16，ADR-0006）
#
# 为什么是文件而不是 settings.py 里的字段：这些值定义"什么算通过"。放在环境变量里
# 意味着可以有人用一行 export 把门禁调松，而产物里看不出区别。放文件里则改动必然
# 经过一次提交、一次评审、一条 CHANGELOG。
#
# 【观察期】本文件当前**不阻断**提交，只产出报告与判定。阈值取自 2026-10-21 用户
# 给出的目标值，待一轮真实评估后按实测分布复核（见 tests/evals/README.md）。
#
# 键名必须与 evaluation/schemas.py 的 MetricName **逐字一致**（脚本会校验，
# 拼错即报错而不是被静默忽略——被忽略的阈值等于没有门禁）。
#
# schema_version 必须与产物 schema 一致；旧阈值文件不会被新代码沿用。

schema_version = 2

[thresholds]

# --- 检索：有标签的可答题 ---

recall_at_k = 0.90
# 相关文档全集被 top-K 证据覆盖的比例。标签由人工补齐，K = EVIDENCE_TOP_K = 8。
# 漏检整份文档是检索侧最贵的错误：召回不到，后面的生成再强也没有依据。

precision_at_k = 0.60
# 返回的证据块里，所属文档在 relevant_documents 中的块数占比（分母是实际返回块数）。
# 分母不固定为 K：可答题大多只有 1–2 份相关文档，固定分母下的上限只有 0.125–0.25，
# 0.60 永远达不到。文档覆盖率由 recall 负责，这里看的是上下文混杂程度。

mrr = 0.75
# 首个相关文档证据位次的倒数。按文档去重后计算；没有命中记 0。

# --- 生成：RAGAS 0.4.3（eval 依赖组） ---
#
# 裁判与生成共用网关上的云端 Qwen（judge 逻辑名），独立性只在判分方法，不在模型。
# 分数按"有偏测量"解读，产物里带 run.judge.caveat。评估语料会出域，
# 仅限公开演示语料，不得用于客户数据或生产（ADR-0006）。

faithfulness = 0.90
# 答案断言中有证据支撑的比例。不设 1.00：模型判定本身有随机性，
# 定成满分等于让裁判抖动直接变成门禁失败。测量失败（ERROR）不带分数、不从聚合中剔除判定。

answer_relevancy = 0.85
# 答案是否正面回应问题。与 faithfulness 分开设阈：一个是"编造"，一个是"答非所问"，
# 混在一起会互相掩盖。合法拒答不调用该指标（适用性规则见 ragas_judge.py）。

answer_correctness = 0.85
# 与参考答案的一致性（75% 事实性 + 25% 语义相似度）。
# 期望 answered 但实际拒答或答案为空时直接记 0，不再单设状态指标。

citation_accuracy = 0.95
# 被引用证据逐条判定"是否支持对应断言"的支持率（裁判）。
# 只算被引用的断言；未引用的断言由 faithfulness 覆盖。
# 每轮另做最多 20 条人工抽检，一致率低于 0.90 时本轮分数不得作为门禁依据。

refusal_correctness = 0.95
# 该拒答时拒答的比例（5 条拒答 + 6 条安全样例）。
# 允许少量偏差：边界题上"证据勉强够"与"该拒"本就难分；但该拒没拒是幻觉风险。

# --- 红线：规范定死，不留余地 ---

citation_integrity = 1.00
# 引用完整性。NO-12：无证据不得给出事实性结论、引用编号必须与正文一致。
# 0.99 意味着每 100 条答案就有 1 条编造或错引引用。

tenant_isolation = 1.00
# 租户隔离（NO-19）。一次越权检索 = 一次数据泄露，不存在可接受的失败率。
# 本指标只覆盖"检索层是否漏了别人的数据"，不能替代集成测试对 RLS 的验证。

prompt_hygiene = 1.00
# 渲染后的证据块不得含未中和的栅栏标记（CLAUDE.md 10.3）。
# 它断言生产渲染路径确实调用了 neutralize_untrusted——接线是否存在，非黑即白。

image_citation_integrity = 1.00
# 图片引用完整性（ADR-0004）：被引用证据带图时，引用条目必须原样带出同样的图。
# 缺图、多图、错图都算失败；这类失败在文本上看不出来。

image_evidence_hit = 0.90
# 期望图片（按文档名 + 页码）随证据被检索到的比例。
# 不要求 media_type=image：RAGFlow 常把 VLM 描述过的图标成 table。
# 四个多模态样例实测 1.0000（2026-10-20），目标值仍留 10% 余量。

# --- 样本量下限 ---
#
# 某指标的实际采样数低于下限时，无论分数多高都**不计为达标**（报告标"样本不足"）。
# 理由：3 条样例算出 1.00 与 20 条算出 0.95，前者不构成证据。
# 缺此项的话，`--limit 3` 跑出来的产物会"全绿通过"，这是最容易骗过自己的假绿。
#
# hallucination_rate 与 document_precision_at_k 只监控、不设门禁，
# 不得出现在本文件任何一段（加载器会拒绝）。

[min_samples]

recall_at_k = 10
precision_at_k = 10
mrr = 10
faithfulness = 10
answer_relevancy = 10
answer_correctness = 10
citation_accuracy = 10
refusal_correctness = 5
citation_integrity = 5
tenant_isolation = 5      # 仅 security 类样例会采集该指标（当前 6 条）
prompt_hygiene = 10       # 每条例题都采样，故下限设高
image_evidence_hit = 3        # 仅带 must_hit 图片的多模态样例采样（当前 4 条）
image_citation_integrity = 3  # 同上；且只在非 retrieval 层采集
