[project]
name = "agent-platform"
version = "0.1.0"
description = "企业级智能体平台 — RAG 主线（RAGFlow 文档工程 + Milvus 检索主链路）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # 编排主干（CLAUDE.md 技术栈锁定：LangGraph 1.x）
    "langgraph>=1.2.15,<1.3",
    "langgraph-checkpoint-postgres>=3.2.0,<3.3",
    "langchain-openai>=1.7.2,<2",
    # HTTP API 与流式
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=3.5.0,<4",
    # 数据校验与配置
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    # 外部调用
    "httpx>=0.28.1,<0.29",
    "tenacity>=9.2.1,<10",
    "pymilvus>=2.6,<2.7",
    "psycopg[binary,pool]>=3.2,<4",
    # Prompt 模板资产化（CLAUDE.md 5.5）
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6",
    "pre-commit>=4",
]

[tool.uv.workspace]
# 预留子包位（CLAUDE.md 2.1 uv workspace monorepo）；当前为单包，不得在无 ADR 时拆分
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

# ---------------------------------------------------------------------------
# ruff：唯一格式与 lint 标准（CLAUDE.md 3.1，行宽 100）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# 文档（含 CLAUDE.md 最高规范与 ADR）中的示例代码块属说明性内容，不参与格式化；
# 且 CLAUDE.md 为只读文件，不得被工具改写。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming（CLAUDE.md 3.4 命名规范）
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # builtins 遮蔽检查
    "C4",   # comprehensions
    "DTZ",  # 强制 aware datetime（CLAUDE.md 3.1 UTC 要求）
    "T10",  # 调试器遗留检查
    "T20",  # 禁止 print（NO-07）
    "PT",   # pytest 风格
    "SIM",  # 简化建议
    "RUF",
]
ignore = [
    # 中文文档字符串与注释场景下放宽行长限制
    "E501",
    # 中文项目：中文全角标点（（）、，。：等）为正常书写，非"易混淆字符"
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
# ``scripts`` 与 ``tests`` 都是本仓第一方代码，但都不在 ``src/`` 下，ruff 的 src 根
# 推导找不到它们，会误判为第三方而排到 ``agent_platform`` 之前。显式声明，避免
# "按工具的误会写 import 顺序"——读者不该从 import 分组里读出错误的依赖方向。
known-first-party = ["scripts", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy：core/agents/api 为严格级（CLAUDE.md 3.1）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
# scripts/ 于阶段五纳入（此前为空目录，会让 mypy 报错）。脚本与 src 同标准：
# 它们是入库与冒烟验证的实际执行入口，类型错了会以"跑一半失败"的形式暴露。
files = ["src/agent_platform", "tests", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["agent_platform.core.*", "agent_platform.agents.*", "agent_platform.api.*"]
strict = true

[[tool.mypy.overrides]]
# 第三方库缺失类型标注时的受控放宽（仅限这些库，不得扩大）
module = ["pymilvus.*", "langgraph.checkpoint.postgres.*", "jinja2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ragas **不是**项目依赖（ADR-0003：它无条件依赖已归档的 langchain-community，
# 违反 NO-14），因此环境里根本没有它的类型信息。它只被 scripts/eval_ragas.py 在
# **隔离环境**里 import，那里同样解析不到 stub。
#
# 为什么这条不算"扩大豁免"：被放宽的对象是**一个本仓永不依赖的库**，放宽之后
# 也不会掩盖本仓自己的类型错误；而另一条路——给那 4 处 import 各贴一个
# `# type: ignore`——反而更差：它会一并吞掉"ragas 改了 API 导致 import 名字不再
# 存在"这类真实故障。范围仅此一项，不得再加。
module = ["ragas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest：单元快而确定；集成由 env 门控（CLAUDE.md 9.3）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# 仓库根入 import 路径，使 tests 能 `from scripts import ingest` 直接测脚本逻辑。
# agent_platform 走已安装包（editable），无需此处声明。
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实基础设施（compose 起 Postgres/Milvus/RAGFlow/LiteLLM）",
    "eval: 需真实基础设施 + 网关裁判模型（RUN_EVAL_TESTS=true）；默认 skip，不进 pre-commit",
]

[tool.coverage.run]
source = ["src/agent_platform"]
# 评估层原先整目录豁免（空壳期的权宜）；既有真代码，豁免收窄到**只能**由
# tests/evals/ 覆盖的执行模块——它要真 Postgres/Milvus/网关，跑不进离线单元门禁。
# 契约、装载、判分、报告、裁判五块必须在 tests/unit/ 里覆盖到，不再豁免。
#
# judge.py 曾经也在这里，理由是"它要连网关"。那个理由看着成立，代价却很实在：
# 它的**失败路径一条都没被跑过**，于是"裁判输出两次不可解析"被记成 score=0.0，
# 一次测量故障伪装成一次质量回归，一直活到首次真实基线对比才暴露（见
# tests/unit/test_evaluation_judge.py 的模块 docstring）。用 fake ChatModel 把
# 它拉回离线测试后覆盖率 95%，豁免随之取消——**豁免掉一个模块的代价，是它坏掉时
# 没人知道**。
omit = [
    "src/agent_platform/evaluation/runner.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
